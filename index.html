<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#003D91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>料理路上</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="料理路上">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

:root {
  --bg:      #f4f7f9;
  --bg2:     #eef6f8;
  --card:    #ffffff;
  --card2:   #f8fbfc;
  --accent:  #019AB3;
  --deep:    #003D91;
  --accent2: #17B5AD;
  --cream:   #1f2937;
  --tan:     #6b7280;
  --border:  #e8edf1;
  --border2: #d1dde5;
  --ink:     #374151;
  --sub:     #6b7280;
  --amber:   #019AB3;
  --amber2:  #003D91;
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}


.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px 110px;
  position: relative;
  z-index: 1;
}

/* ── HEADER ─────────────────────────────────────── */
header {
  text-align: center;
  padding: 44px 0 30px;
}

.header-glow {
  font-size: 48px;
  display: block;
  margin-bottom: 14px;
  filter: drop-shadow(0 4px 12px rgba(1,154,179,.25));
}

header h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 26px;
  font-weight: 900;
  color: var(--deep);
  letter-spacing: .12em;
}

.header-rule {
  width: 72px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 14px auto 8px;
}

header .sub {
  color: var(--tan);
  font-size: 12.5px;
  letter-spacing: .08em;
}

/* ── SEARCH ─────────────────────────────────────── */
.search {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 10px 0 12px;
  background: linear-gradient(180deg, var(--bg) 65%, transparent 100%);
}

.search-wrap { position: relative; }

.search-wrap::before {
  content: '🔍';
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  pointer-events: none;
  z-index: 1;
  opacity: .6;
}

.search input {
  width: 100%;
  padding: 13px 16px 13px 42px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 14px;
  color: var(--cream);
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}

.search input::placeholder { color: var(--sub); }

.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(1,154,179,.12);
}

/* ── CATEGORIES ─────────────────────────────────── */
.cats { display: flex; flex-direction: column; gap: 8px; }

.cat {
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s;
}

.cat.open { border-color: var(--accent); }

.cat-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border: none;
  padding: 16px 18px;
  cursor: pointer;
  font-family: inherit;
  color: var(--cream);
  transition: background .18s;
  -webkit-appearance: none;
}

.cat.open .cat-btn { background: var(--card2); }

.cat-label {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cat-emoji { font-size: 22px; }

.cat-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--cream);
  letter-spacing: .04em;
}

.cat-right { display: flex; align-items: center; gap: 10px; }

.cat-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(1,154,179,.1);
  border: 1px solid rgba(1,154,179,.25);
  color: var(--accent);
  letter-spacing: .04em;
}

.cat-chevron {
  color: var(--sub);
  font-size: 11px;
  transition: transform .25s;
  display: inline-block;
}

.cat.open .cat-chevron { transform: rotate(180deg); }

.cat-panel {
  display: none;
  background: var(--bg2);
  padding: 8px;
  border-top: 1px solid var(--border);
}

.cat.open .cat-panel { display: block; }

/* ── DISH ROWS ───────────────────────────────────── */
.dish-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 15px;
  margin: 5px 0;
  cursor: pointer;
  font-family: inherit;
  color: var(--cream);
  text-align: left;
  transition: background .15s, border-color .15s;
  -webkit-appearance: none;
}

.dish-btn.open {
  background: rgba(1,154,179,.04);
  border-color: var(--accent);
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.dish-left { display: flex; align-items: center; gap: 9px; }
.dish-ico  { font-size: 18px; line-height: 1; }

.dish-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--cream);
}

.dish-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.dish-label {
  font-size: 11px;
  color: var(--amber);
  font-weight: 600;
  letter-spacing: .04em;
}

.dish-chevron {
  color: var(--amber);
  font-size: 10px;
  transition: transform .2s;
  display: inline-block;
}

.dish-btn.open .dish-chevron { transform: rotate(180deg); }

/* ── RECIPE CARD ─────────────────────────────────── */
.dish-card {
  display: none;
  background: var(--card);
  border: 1px solid var(--accent);
  border-top: none;
  border-radius: 0 0 12px 12px;
  margin-bottom: 5px;
  padding: 14px 15px 18px;
}

.dish-card.open { display: block; }

/* meta chips */
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.chip {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(1,154,179,.08);
  border: 1px solid rgba(1,154,179,.2);
  color: var(--accent);
  font-weight: 600;
  letter-spacing: .04em;
}

/* section head */
.sec { margin-bottom: 16px; }

.sec h3 {
  font-family: 'Noto Serif TC', serif;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 10px;
  padding: 5px 0 5px 12px;
  border-left: 3px solid var(--amber);
  letter-spacing: .06em;
}

/* ingredient table */
table { width: 100%; border-collapse: collapse; }
col.c-name { width: 28%; }
col.c-qty  { width: 34%; }
col.c-note { width: 38%; }

th {
  background: rgba(1,154,179,.06);
  color: var(--deep);
  font-size: 11.5px;
  font-weight: 700;
  padding: 8px 9px;
  border-bottom: 1px solid var(--border2);
  text-align: left;
  letter-spacing: .06em;
  white-space: nowrap;
}

td {
  padding: 9px 9px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  vertical-align: top;
  word-break: break-word;
  color: var(--ink);
  line-height: 1.5;
}

td:nth-child(1) { font-weight: 600; color: var(--deep); }
td:nth-child(2) { color: var(--accent); font-size: 12.5px; word-break: keep-all; }
td:nth-child(3) { color: var(--sub);    font-size: 12.5px; }
tr:last-child td { border-bottom: none; }

/* steps */
ol { list-style: none; counter-reset: step; padding: 0; }

ol li {
  counter-increment: step;
  position: relative;
  padding: 10px 0 10px 46px;
  border-bottom: 1px solid var(--border);
  font-size: 14.5px;
  color: var(--ink);
}

ol li:last-child { border-bottom: none; }

ol li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 10px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--deep), var(--accent));
  color: #fff;
  font-weight: 900;
  font-size: 12.5px;
  font-family: 'Noto Sans TC', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,61,145,.2);
  flex-shrink: 0;
}

ol li strong { color: var(--deep); }

/* tips */
.tip-box {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 12px;
  padding: 12px 14px;
}

.tip-box h3 {
  color: #b45309 !important;
  border-color: #f59e0b !important;
}

.tip-box p, .tip-box li {
  color: #92400e;
  font-size: 13.5px;
}

.tip-box ul { padding-left: 18px; }

/* no-hit */
.nohit {
  display: none;
  text-align: center;
  color: var(--sub);
  padding: 50px 20px;
  font-size: 14px;
  letter-spacing: .06em;
}

/* ── HOME BUTTON ─────────────────────────────────── */
.home-btn {
  position: fixed;
  right: 18px;
  bottom: 22px;
  z-index: 20;
  background: linear-gradient(135deg, var(--deep), var(--accent));
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: 0 4px 18px rgba(0,61,145,.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  -webkit-appearance: none;
  transition: box-shadow .2s, transform .1s;
}

.home-btn:active { transform: scale(.96); }

/* ── FOOTER ──────────────────────────────────────── */
footer {
  text-align: center;
  color: var(--sub);
  font-size: 12px;
  padding: 28px 0;
  letter-spacing: .12em;
}

.footer-rule {
  width: 56px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 0 auto 14px;
}
</style>
</head>
<body>
<div class="wrap" id="top">

  <header>
    <span class="header-glow">🍲</span>
    <h1>料理路上</h1>
    <div class="header-rule"></div>
    <p class="sub">共 0 道・手機查食譜</p>
  </header>

  <div class="search">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="搜尋菜名或食材…" autocomplete="off">
    </div>
  </div>

  <div class="cats">
    
  </div>

  <div id="nohit" class="nohit">找不到符合的料理 🥲</div>

  <footer>
    <div class="footer-rule"></div>
    家常・營養・簡單快手
  </footer>

</div>

<button id="home" class="home-btn" title="回首頁">⌂ 首頁</button>

<script>

function toggleCat(b) {
  var c = b.parentElement;
  c.classList.toggle('open');
}

function toggleDish(b) {
  b.classList.toggle('open');
  var d = b.nextElementSibling;
  if (d) d.classList.toggle('open');
  var lbl = b.querySelector('.dish-label');
  if (lbl) lbl.textContent = b.classList.contains('open') ? '收合' : '食譜';
}

var q = document.getElementById('q');
q.addEventListener('input', function() {
  var t = this.value.trim().toLowerCase();
  var anyAll = false;
  document.querySelectorAll('.cat').forEach(function(c) {
    var any = false;
    c.querySelectorAll('.dish-btn').forEach(function(b) {
      var n = (b.getAttribute('data-name') || '').toLowerCase();
      var card = b.nextElementSibling;
      var hit = !t || n.indexOf(t) >= 0 || (card && card.textContent.toLowerCase().indexOf(t) >= 0);
      b.style.display = hit ? 'flex' : 'none';
      if (card && !hit) card.style.display = 'none';
      if (hit) any = true;
    });
    c.style.display = (any || !t) ? 'block' : 'none';
    if (t && any) c.classList.add('open');
    if (!t) c.classList.remove('open');
    if (any) anyAll = true;
  });
  document.getElementById('nohit').style.display = (t && !anyAll) ? 'block' : 'none';
});

document.getElementById('home').addEventListener('click', function() {
  var s = document.getElementById('q');
  if (s) s.value = '';
  document.querySelectorAll('.cat').forEach(function(c) {
    c.classList.remove('open');
    c.style.display = 'block';
  });
  document.querySelectorAll('.dish-btn').forEach(function(b) {
    b.style.display = 'flex';
    b.classList.remove('open');
    var lbl = b.querySelector('.dish-label');
    if (lbl) lbl.textContent = '食譜';
  });
  document.querySelectorAll('.dish-card').forEach(function(d) {
    d.classList.remove('open');
    d.style.display = '';
  });
  document.getElementById('nohit').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

</script>
</body>
</html>
